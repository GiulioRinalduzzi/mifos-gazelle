# OpenSPP — Social Protection Platform (Odoo 17-based)
#
# Resource budget:
#   PostgreSQL:  128Mi req / 512Mi limit
#   OpenSPP:     512Mi req / 1536Mi limit
#   Net addition to cluster: ~640Mi steady-state, ~2GB peak during startup
#
# To offset the RAM cost when enabling OpenSPP, consider reducing or
# disabling Kibana in src/deployer/helm/infra/values.yaml (~800Mi saved).
# Raises effective minimum RAM from 6 GB to ~8 GB.

############### OpenSPP (Odoo) ####################
openspp:
  replicaCount: 1

  image:
    # Default: official Odoo image (public, no auth required).
    # Replace with the actual OpenSPP image once available:
    #   repository: ghcr.io/openspp/openspp-base
    repository: docker.io/odoo
    tag: "17.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1536Mi"
      cpu: "1000m"

  # PostgreSQL connection — matches postgresql.auth values below
  env:
    HOST: "postgresql"
    PORT: "5432"
    USER: "openspp"
    PASSWORD: "opensppPas42"
    DB: "openspp"
    ADMIN_PASSWD: "admin"
    LIST_DB: "False"

  ingress:
    enabled: true
    className: nginx
    host: openspp.mifos.gazelle.test

  service:
    port: 8069

############### PostgreSQL (dedicated to OpenSPP) ####################
# Deployed via inline StatefulSet in templates/postgresql.yaml.
# Uses docker.io/postgres:16 — no OCI registry auth required.
# Persistence disabled (emptyDir) to stay within the 30 GB disk baseline.
postgresql:
  enabled: true

  image:
    tag: "16"

  auth:
    username: "openspp"
    password: "opensppPas42"
    database: "openspp"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
